# data.yaml for COCO val 평가 (학습 vocab 40 클래스 기준)
# 라벨은 remap_coco_to_40.py로 재인덱싱된 것을 사용
# ultralytics 규약: val: "*/images" → labels는 "*/labels"에서 자동 발견

path: /app/eval
train: val2017/images   # train은 안 함; ultralytics가 키를 요구해서 placeholder
val:   val2017/images

nc: 40
names: [
  "person", "bicycle", "car", "motorcycle", "bus", "truck", "train", "boat",
  "airplane", "traffic light", "traffic sign", "stop sign", "fire hydrant",
  "parking meter", "bench", "crosswalk", "pothole", "road marking",
  "construction cone", "barrier", "bird", "cat", "dog", "horse", "sheep",
  "cow", "backpack", "handbag", "umbrella", "suitcase", "ball", "kite",
  "skateboard", "surfboard", "bottle", "cup", "chair", "laptop", "cell phone",
  "book"
]
